# Lab-Stack auf docker.fritz.box — Ports sind an die LAN-IP gebunden,
# TLS und Domains übernimmt der Nginx Proxy Manager.
name: ccvb

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      CCVB_LAB_DB_PASSWORD: ${CCVB_LAB_DB_PASSWORD:?}
      CCVB_DEV_DB_PASSWORD: ${CCVB_DEV_DB_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    ports:
      - "192.168.20.203:8132:5432"
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  cms:
    build:
      context: ..
      dockerfile: docker/cms.Dockerfile
    image: ccvb/cms:lab
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ccvb_lab:${CCVB_LAB_DB_PASSWORD}@postgres:5432/ccvb_lab
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?}
      PREVIEW_SECRET: ${PREVIEW_SECRET:?}
      PREVIEW_API_KEY: ${PREVIEW_API_KEY:?}
      REBUILD_URL: http://web:4321/internal/rebuild
      REBUILD_TOKEN: ${REBUILD_TOKEN:?}
      SERVER_URL: https://ccvbcms.lab.code-ops.de
      WEB_URL: https://ccvbastro.lab.code-ops.de
      MEDIA_DIR: /data/media
      # Optional – ohne SMTP_HOST werden Mails nur geloggt
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - media:/data/media
    ports:
      - "192.168.20.203:8131:3000"
    networks: [internal]
    mem_limit: 1536m

  # Einmalige Aufgaben mit der Payload-CLI, z. B. Beispielinhalte:
  #   docker compose --env-file .env.lab -f docker/compose.lab.yml run --rm cms-tools run scripts/seed.ts
  cms-tools:
    profiles: [tools]
    build:
      context: ..
      dockerfile: docker/cms.Dockerfile
      target: tools
    image: ccvb/cms-tools:lab
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ccvb_lab:${CCVB_LAB_DB_PASSWORD}@postgres:5432/ccvb_lab
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?}
      MEDIA_DIR: /data/media
      # Änderungen lösen wie im CMS einen Neubau der Website aus
      REBUILD_URL: http://web:4321/internal/rebuild
      REBUILD_TOKEN: ${REBUILD_TOKEN:?}
    volumes:
      - media:/data/media
    networks: [internal]

  # Builder + Astro-Node-Server (Formulare, Vorschau). Baut die statische Website ins Volume www.
  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    image: ccvb/web:lab
    restart: unless-stopped
    depends_on: [cms]
    environment:
      CMS_URL: http://cms:3000
      SITE_URL: https://ccvbastro.lab.code-ops.de
      MEDIA_URL: /media
      PREVIEW_SECRET: ${PREVIEW_SECRET:?}
      CMS_API_KEY: ${PREVIEW_API_KEY:?}
      REBUILD_TOKEN: ${REBUILD_TOKEN:?}
      # Uptime-Kuma-Push-Monitor „CCVB Website-Build“ (optional)
      MONITOR_PUSH_URL: ${MONITOR_PUSH_URL_BUILD:-}
    volumes:
      - www:/data/www
    networks: [internal]
    mem_limit: 1536m

  # Nächtliches Backup (pg_dump + Medien) per restic nach /opt/backups/ccvb/repo auf dem Host,
  # sonntags zusätzlich Prüfung und Restore-Test. Siehe docs/BETRIEB.md.
  backup:
    build: ./backup
    image: ccvb/backup:lab
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RESTIC_REPOSITORY: /repo
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?}
      PGHOST: postgres
      PGUSER: ccvb_lab
      PGPASSWORD: ${CCVB_LAB_DB_PASSWORD:?}
      PGDATABASE: ccvb_lab
      # nur für den Restore-Test (Wegwerf-Datenbank anlegen/löschen)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      BACKUP_TIME: "02:30"
      # Uptime-Kuma-Push-Monitor „CCVB Backup“ (optional)
      MONITOR_PUSH_URL: ${MONITOR_PUSH_URL_BACKUP:-}
    volumes:
      - media:/data/media:ro
      - /opt/backups/ccvb/repo:/repo
      # Ziel für Wiederherstellungen im Ernstfall (docs/BETRIEB.md)
      - /opt/backups/ccvb/restore:/restore
    networks: [internal]
    mem_limit: 512m

  # Liefert die Website aus – läuft auch, wenn CMS oder Builder stehen.
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - www:/srv/www:ro
      - media:/srv/media:ro
      - caddy_data:/data
    ports:
      - "192.168.20.203:8130:80"
    networks: [internal]
    mem_limit: 256m

volumes:
  pgdata:
  media:
  www:
  caddy_data:

networks:
  internal:
